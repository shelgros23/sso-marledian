<style>
:root{--or:#e8742a;--or2:#fbe3d2;--bg:#f5f3f0;--card:#fff;--tx:#222;--mu:#6b6b6b;--ln:#e4e0db;--ok:#1f8a4c;--okb:#ddf3e6;--am:#a86400;--amb:#fff0cc;--rd:#c0322b;--rdb:#fde0de;--bl:#2459a8;--blb:#e1ebfa}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;overflow-x:hidden;min-height:100%}
header{position:sticky;top:0;z-index:5;background:var(--or);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px 10px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header .t{font-weight:700;font-size:17px}header small{display:block;font-weight:400;font-size:12px;opacity:.9}

h2{font-size:18px;margin:2px 0 8px}h3{font-size:15px;margin:14px 0 6px;color:var(--or)}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px #0001}

.kpi.r b{color:var(--rd)}.kpi.a b{color:var(--am)}.kpi.g b{color:var(--ok)}

.item>div:first-child{min-width:0;overflow-wrap:anywhere}
.item:last-child{border-bottom:0}.item .col{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.tap{cursor:pointer}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--okb);color:var(--ok)}.b-prox{background:var(--amb);color:var(--am)}.b-venc,.b-pend,.b-no{background:var(--rdb);color:var(--rd)}.b-info{background:var(--blb);color:var(--bl)}
.alert{padding:10px 12px;border-radius:10px;margin:8px 0;font-size:14px}
.alert.venc{background:var(--rdb);color:var(--rd)}.alert.prox{background:var(--amb);color:var(--am)}.alert.ok{background:var(--okb);color:var(--ok)}.alert.info{background:var(--blb);color:var(--bl)}
button,.btn,.btn2{font:inherit;border-radius:10px;border:1px solid var(--ln);background:#fff;padding:10px 14px;cursor:pointer;color:var(--tx)}
.btn{background:var(--or);border-color:var(--or);color:#fff;font-weight:600}
.btn2{background:var(--or2);border-color:var(--or2);color:#8a3d0a;font-weight:600}
button.sm{padding:5px 10px;font-size:13px}button.danger{color:var(--rd);border-color:#f0b7b3}
.full{width:100%;display:block;margin:8px 0}.big{padding:16px;font-size:17px}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;background:#fff;color:var(--tx);margin-top:4px}
input[type=checkbox]{width:auto;margin:0 8px 0 0;transform:scale(1.2)}
label{display:block;margin:8px 0;font-size:13px;color:var(--mu)}
label.chk{display:flex;align-items:center;color:var(--tx);font-size:14px;margin:6px 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

<body>
<header><div><div class="t">SSO · Marledian</div><small>DENMAR S.A. · EPP, capacitaciones y fumigación</small></div><button onclick="go('ajustes')" aria-label="Ajustes">⚙️</button></header>
<main id="view"></main>
<nav id="nav"></nav>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>

<input type="file" id="foto" accept="image/*" capture="environment" hidden onchange="scanFoto(this)">
<script src="zxing.min.js"></script>
<script>
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
/* ================= Utilidades ================= */
const KEY='sso_marledian_v2';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
const fmtD=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hoy=()=>fmtD(new Date());
const parseD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return fmtD(d)};
const addMonths=(s,n)=>{const d=parseD(s);d.setMonth(d.getMonth()+n);return fmtD(d)};
const diffDates=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const diff=s=>diffDates(hoy(),s);
const showD=s=>s?s.split('-').reverse().join('/'):'—';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
const up=s=>norm(s).toUpperCase();
const $=id=>document.getElementById(id);
const diasTxt=d=>d==null?'':d<0?`hace ${-d} días`:d===0?'hoy':`en ${d} días`;
const antig=s=>{if(!s)return'';const d=diffDates(s,hoy());return d<60?d+' días':d<730?Math.floor(d/30.4)+' meses':(d/365).toFixed(1)+' años'};
const cedNorm=c=>{c=String(c??'').replace(/\D/g,'');return c.length===9?'0'+c:c};
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2200)}
const MESES={enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,agosto:8,septiembre:9,setiembre:9,octubre:10,noviembre:11,diciembre:12};
function parseFecha(v){
  if(v==null||v==='')return '';
  if(v instanceof Date&&!isNaN(v)){const d=new Date(v.getTime()+12*36e5);return fmtD(d)}
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5)+12*36e5);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
  const s=norm(v);let m;
  if(m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/))return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);
  if(m=s.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/)){const y=m[3].length===2?'20'+m[3]:m[3];if(+m[2]<=12)return y+'-'+pad(m[2])+'-'+pad(m[1])}
  if(m=s.match(/(\d{1,2}) de ([a-z]+) de (\d{4})/)){const mm=MESES[m[2]];if(mm)return m[3]+'-'+pad(mm)+'-'+pad(m[1])}
  if(/^\d{5}$/.test(s))return parseFecha(+s);
  return '';
}
const hashPin=p=>{let h=5381;for(const c of 'sso'+p)h=((h<<5)+h+c.charCodeAt(0))|0;return String(h)};

/* ================= Datos por defecto ================= */
const TALLAS=[['botas','Botas'],['guantes','Guantes'],['buso','Buso'],['camisa','Camisa'],['pantalon','Pantalón'],['calentador','Calentador'],['mandil','Mandil'],['zapatos','Zapatos']];
const TL=Object.fromEntries(TALLAS);
function defaults(){
  const E=(id,nombre,tipo,talla,unidad,minimo)=>({id,nombre,tipo,talla,unidad,minimo,stock:{}});
  const epps=[
    E('botas','Botas de caucho','epp','botas','par',20),E('plant','Plantillas','epp','botas','par',20),
    E('g_cuero','Guante de cuero','epp','guantes','par',20),E('g_showa','Guante Showa 7000','epp','guantes','par',30),
    E('g_nit','Guantes de nitrilo','epp','guantes','par',30),E('resp','Respirador media cara','epp','','unidad',5),
    E('filt','Filtros/cartuchos para respirador','epp','','par',10),E('traje','Traje impermeable de fumigación','epp','buso','unidad',5),
    E('gafas','Gafas de seguridad','epp','','unidad',10),E('mand_imp','Mandil impermeable','epp','mandil','unidad',10),
    E('masc','Mascarilla desechable','epp','','unidad',50),E('tapon','Tapones auditivos','epp','','par',10),
    E('careta','Protector facial / careta','epp','','unidad',3),E('papel','Papel higiénico','epp','','rollo',50),
    E('d_jean','Pantalón jean','dot','pantalon','unidad',10),E('d_calaz','Terno calentador azul','dot','calentador','unidad',10),
    E('d_calro','Terno calentador rojo','dot','calentador','unidad',5),E('d_chzaf','Chaleco zafari rojo','dot','camisa','unidad',5),
    E('d_mandaz','Mandil azul','dot','mandil','unidad',10),E('d_camis','Camiseta manga larga ploma','dot','camisa','unidad',10),
    E('d_camjean','Camisa jean franja de seguridad','dot','camisa','unidad',5),E('d_panfr','Pantalón jean franja de seguridad','dot','pantalon','unidad',5),
    E('d_buff','Buff','dot','','unidad',10),E('d_media','Media térmica','dot','','par',10),
    E('d_gorro','Gorro tipo zafari','dot','','unidad',10),E('d_chent','Chaleco de entrenamiento','dot','buso','unidad',5)];
  const caps=[['ind','Inducción de SSO',0],['fito','Fitosanidad – manejo seguro de agroquímicos',12],['drench','Drench – aplicación segura',12],['epp','Uso y cuidado de EPP',12],['pa','Primeros auxilios',12],['emer','Plan de emergencia y evacuación',12],['ergo','Ergonomía y levantamiento de cargas',12],['maq','Uso seguro de herramientas y maquinaria',12]]
    .map(([id,nombre,vigencia])=>({id,nombre,vigencia}));
  const DOT=[['d_jean',365,1],['d_camis',365,1],['d_mandaz',365,1],['d_gorro',365,1],['d_buff',180,1]];
  const FUM=[['resp',180,1],['filt',30,1],['traje',90,1],['g_nit',15,1],['botas',180,1],['gafas',180,1]];
  const P=(id,nombre,rot,claves,ep,caps,dot=true)=>({id,nombre,rot,claves,epps:[...ep,...(dot?DOT:[])].map(([eppId,frec,cant])=>({eppId,frec,cant})),caps});
  const puestos=[
    P('sup_fum','Supervisor de fumigación',0,['SUPERVISOR FUMIG','SUPERVISION FUMIG','SUPERVISOR FITO','SUPERVISOR  FUMIG'],FUM,['ind','fito','epp','pa','emer']),
    P('aplic','Aplicador (fumigación)',6,['APLICADOR','FITOSANIDAD'],FUM,['ind','fito','epp','pa','emer']),
    P('bomb','Bombero (fumigación)',12,['BOMBERO'],[...FUM,['mand_imp',90,1]],['ind','fito','epp','pa','emer']),
    P('drench','Drench',0,['DRENCH'],[...FUM,['mand_imp',90,1]],['ind','drench','epp','emer']),
    P('sup','Supervisor de cultivo',0,['SUPERVISOR','SUPERVISION'],[['botas',180,1]],['ind','epp','pa','emer']),
    P('cort','Cortador',0,['CORTADOR'],[['botas',180,1],['plant',90,1],['g_cuero',30,1],['papel',30,1]],['ind','epp','ergo','emer']),
    P('post','Poscosecha',0,['POSTCOSECHA','POST-COSECHA','POST COSECHA','TINTURADO','CALIDAD'],[['g_showa',15,1],['mand_imp',90,1],['botas',180,1]],['ind','epp','ergo','emer']),
    P('transp','Transporte de flor / tractorista',0,['TRANSPORTE','TRACTOR'],[['botas',180,1],['g_cuero',30,1],['tapon',30,1]],['ind','epp','maq','emer']),
    P('riego','Riego',0,['RIEGO'],[['botas',180,1],['g_showa',15,1]],['ind','epp','emer']),
    P('mant','Mantenimiento',0,['MOTOGUADA','SOLDADOR','PLASTICO','JARDIN','MANTENIMIENTO','CESPED','ELECT','OBRA CIVIL'],[['botas',180,1],['g_cuero',30,1],['gafas',180,1],['tapon',30,1],['careta',180,1]],['ind','epp','maq','emer']),
    P('monit','Monitoreo / agrobacterias',0,['MONITOREO','AGROBACTERIA','ORGANICO'],[['botas',180,1],['g_nit',15,1],['masc',7,5]],['ind','epp','emer']),
    P('admin','Administrativo / guardias',0,['ADMIN','PORTER','GUARD','BODEGA','RECURSOS HUMANOS','MEDIC','ENFERMER','SOCIAL','AGRONOMO','SEGURIDAD Y SALUD','TECNICO DE SSO','JEFE'],[],['ind','emer'],false),
    P('cult','Obrero de cultivo / apoyo',0,[],[['botas',180,1],['g_cuero',30,1],['papel',30,1]],['ind','epp','ergo','emer'])];
  return {v:2,epps,caps,puestos,trab:[],entregas:[],capReg:[],sesiones:[],inspecciones:[],movs:[],rotaciones:[],
    cfg:{horizonte:30,margen:15,ingresosMes:'',ultimoRespaldo:'',pinHash:'',importado:''}};
}
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.trab)return{...defaults(),...j}}catch(e){}return defaults()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('No se pudo guardar: '+e.message)}}
let S=load();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});

const T=id=>S.trab.find(x=>x.id===id);
const PU=id=>S.puestos.find(x=>x.id===id);
const EP=id=>S.epps.find(x=>x.id===id);
const CA=id=>S.caps.find(x=>x.id===id);
const activo=t=>t.estado!=='retirado';
const pn=t=>PU(t.puestoId)?.nombre||'Sin puesto';
const stockTotal=e=>Object.values(e.stock||{}).reduce((a,b)=>a+(+b||0),0);
const tallaDe=(t,e)=>e&&e.talla?String((t.tallas||{})[e.talla]||'S/T'):'';
const tallaTxt=k=>k===''?'—':k;
function asignarPuesto(textos){
  for(const tx of textos){const u=up(tx);if(!u)continue;for(const p of S.puestos)if((p.claves||[]).some(c=>u.includes(up(c))))return p.id}
  return S.puestos.find(p=>p.id==='cult')?'cult':S.puestos[0]?.id||'';
}

/* ================= Cálculos ================= */
let LM={},LC={};
function idx(){
  LM={};for(const x of S.entregas){const k=x.trabId+'|'+x.eppId;if(!LM[k]||x.fecha>LM[k].fecha)LM[k]=x}
  LC={};for(const x of S.capReg){const k=x.trabId+'|'+x.capId;if(!LC[k]||(x.fecha||'')>(LC[k].fecha||''))LC[k]=x}
}
function eppEstado(t,tipo){
  const p=PU(t.puestoId);if(!p)return[];
  return p.epps.filter(pe=>{const e=EP(pe.eppId);return e&&(!tipo||e.tipo===tipo)}).map(pe=>{
    const u=LM[t.id+'|'+pe.eppId];const prox=u?addDays(u.fecha,pe.frec):null;const dias=prox?diff(prox):null;
    return{...pe,ult:u&&u.fecha,prox,dias,est:!u?'pend':dias<0?'venc':dias<=7?'prox':'ok'}});
}
function capEstado(t){
  const p=PU(t.puestoId);if(!p)return[];
  return p.caps.map(cid=>{const c=CA(cid);if(!c)return null;const u=LC[t.id+'|'+cid];
    const vence=u&&u.fecha&&+c.vigencia?addMonths(u.fecha,+c.vigencia):null;
    return{cap:c,fecha:u?u.fecha:null,tiene:!!u,vence,est:!u?'no':vence&&diff(vence)<0?'venc':vence&&diff(vence)<=30?'prox':'ok'}}).filter(Boolean);
}
function rotEstado(t){
  const p=PU(t.puestoId);if(!p||!activo(t))return null;
  if(t.rotDefinitivo)return{def:true,est:'ok',meses:p.rot};
  if(!(+p.rot)&&!t.fechaCambio)return null;
  const ini=t.inicioPuesto||t.ingreso;
  const fecha=t.fechaCambio||(ini?addMonths(ini,+p.rot):null);if(!fecha)return null;
  const dias=diff(fecha);return{fecha,dias,meses:p.rot,est:dias<0?'venc':dias<=30?'prox':'ok'};
}
const esFumig=t=>{const p=PU(t.puestoId);return p&&(+p.rot>0||['sup_fum','aplic','bomb'].includes(p.id))};
function desercion(){
  const d90=addDays(hoy(),-90);
  const rec=S.trab.filter(t=>t.ingreso&&t.ingreso>=d90);
  const rapido=t=>t.estado==='retirado'&&t.salida&&t.ingreso&&diffDates(t.ingreso,t.salida)<=7;
  const rap=rec.filter(rapido);
  const ids=new Set(S.trab.filter(rapido).map(t=>t.id));let unidades=0;S.entregas.forEach(x=>{if(ids.has(x.trabId))unidades+=x.cant});
  const sal90=S.trab.filter(t=>t.estado==='retirado'&&t.salida&&t.salida>=d90);
  const mot={};sal90.forEach(t=>{const m=(t.motivoSalida||'Sin motivo').toUpperCase().trim();mot[m]=(mot[m]||0)+1});
  return{rec,nRec:rec.length,nRap:rap.length,pct:rec.length?Math.round(rap.length*100/rec.length):0,porMes:+(rec.length/3).toFixed(1),unidades,nSal:sal90.length,motivos:Object.entries(mot).sort((a,b)=>b[1]-a[1]).slice(0,5)};
}
function estimar(){
  idx();const H=+S.cfg.horizonte||30,M=(+S.cfg.margen||0)/100,need={};
  const add=(eid,tl,k,v)=>{need[eid]=need[eid]||{};need[eid][tl]=need[eid][tl]||{ren:0,nue:0};need[eid][tl][k]+=v};
  const act=S.trab.filter(activo);
  act.forEach(t=>eppEstado(t).forEach(e=>{
    const fr=Math.max(1,e.frec),tl=tallaDe(t,EP(e.eppId));
    if(e.est==='pend'){
      // Sin registro de entrega: si es reciente se asume el kit al ingresar; si es antiguo, un cambio promedio
      const dIng=t.ingreso?diffDates(t.ingreso,hoy()):9999;
      if(dIng<fr){const start=fr-dIng;if(start<=H)add(e.eppId,tl,'ren',e.cant*(1+Math.floor((H-start)/fr)))}
      else add(e.eppId,tl,'ren',e.cant*H/fr);
      return;
    }
    const start=Math.max(e.dias,0);
    if(start<=H)add(e.eppId,tl,'ren',e.cant*(1+Math.floor((H-start)/fr)));
  }));
  const d=desercion();
  const porMes=S.cfg.ingresosMes!==''&&S.cfg.ingresosMes!=null?+S.cfg.ingresosMes:d.porMes;
  const nuevos=porMes*H/30,base=d.rec.length?d.rec:act,dist={};
  base.forEach(t=>dist[t.puestoId]=(dist[t.puestoId]||0)+1);const n=base.length||1;
  S.puestos.forEach(p=>{
    const esp=nuevos*(dist[p.id]||0)/n;if(!esp)return;
    const gente=act.filter(t=>t.puestoId===p.id);const pool=gente.length?gente:act;
    p.epps.forEach(pe=>{const e=EP(pe.eppId);if(!e)return;
      if(!e.talla){add(e.id,'','nue',esp*pe.cant);return}
      const cnt={};pool.forEach(t=>{const k=tallaDe(t,e);cnt[k]=(cnt[k]||0)+1});const tot=pool.length||1;
      Object.entries(cnt).forEach(([k,c])=>add(e.id,k,'nue',esp*pe.cant*c/tot));
    });
  });
  const filas=S.epps.map(e=>{
    const tl=new Set([...Object.keys(need[e.id]||{}),...Object.keys(e.stock||{})]);
    const det=[...tl].sort((a,b)=>(parseFloat(a)||a.charCodeAt(0)||0)-(parseFloat(b)||b.charCodeAt(0)||0)).map(k=>{const r=(need[e.id]||{})[k]||{ren:0,nue:0};const total=Math.ceil((r.ren+r.nue)*(1+M));const st=+(e.stock||{})[k]||0;return{k,ren:Math.ceil(r.ren),nue:Math.ceil(r.nue),total,stock:st,comprar:Math.max(0,total-st)}});
    const sum=f=>det.reduce((a,x)=>a+x[f],0);
    return{e,det,stock:stockTotal(e),ren:sum('ren'),nue:sum('nue'),total:sum('total'),comprar:sum('comprar')};
  });
  return{porMes,H,filas};
}

/* ================= Escáner ================= */
const nativo='BarcodeDetector' in window,zx=!!window.ZXing,tieneLector=nativo||zx;
let zxReader=null,scanStream=null,PEND=null,PHOTO_CB=null,scanCb=null,lastCode='',lastAt=0;
function vEscanear(){
  return `<div class="card"><h2>Inspección en campo</h2>
    <p class="muted">Escanee el código de barras del carnet o busque por código, cédula o nombre.</p>
    ${tieneLector?`<button class="btn big full" onclick="scanLive(v=>{encontrado(v);return false})">📷 Escanear carnet</button><button class="btn2 full" onclick="PHOTO_CB=encontrado;$('foto').click()">Tomar foto del código de barras</button>`
      :`<div class="alert prox">No se pudo cargar el lector. Busque manualmente.</div>`}
    <input type="search" id="bq" placeholder="Código, cédula o nombre" oninput="$('bres').innerHTML=buscarScan(this.value)">
  </div><div class="card" id="bres"><p class="muted">Escriba para buscar.</p></div>`;
}
function buscarScan(q){if(!q.trim())return '<p class="muted">Escriba para buscar.</p>';idx();const l=S.trab.filter(t=>coincide(t,q)).slice(0,30);return l.length?l.map(filaTrab).join(''):'<p class="muted">No se encontró ningún trabajador.</p>'}
function buscarCodigo(raw){
  const v=String(raw).trim().toUpperCase(),c=cedNorm(v);
  return S.trab.find(x=>x.codigo&&x.codigo===v)||S.trab.find(x=>x.cedula&&c.length>=9&&x.cedula===c)||S.trab.find(x=>(x.cedula&&v.includes(x.cedula))||(x.codigo&&x.codigo.length>3&&v.includes(x.codigo)));
}
function onCode(val){
  const now=Date.now();if(val===lastCode&&now-lastAt<2500)return;lastCode=val;lastAt=now;
  if(navigator.vibrate)navigator.vibrate(100);
  const seguir=scanCb&&scanCb(val);if(!seguir)stopScan();
}
async function scanLive(cb,titulo,alCerrar){
  scanCb=cb;lastCode='';
  openModal(`<h2>${titulo||'Apunte al código de barras'}</h2><video id="vid" playsinline muted autoplay style="width:100%;border-radius:12px;background:#000;min-height:200px"></video><p class="muted">Buena luz, carnet quieto y código horizontal.</p><div id="scanMsg" class="muted"></div><button class="btn2 full" onclick="stopScan();${alCerrar?alCerrar:'closeModal()'}">${alCerrar?'Terminar':'Cancelar'}</button>`);
  if(!nativo){
    try{zxReader=new ZXing.BrowserMultiFormatReader(null,200);
      await zxReader.decodeFromConstraints({video:{facingMode:'environment'}},$('vid'),r=>{if(r&&zxReader)onCode(r.getText())});
    }catch(e){stopScan();closeModal();alert('No se pudo abrir la cámara. Revise el permiso de cámara o use “Tomar foto”.')}
    return;
  }
  let det;try{det=new BarcodeDetector()}catch(e){closeModal();alert('Lector no disponible.');return}
  try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(e){closeModal();alert('No se pudo abrir la cámara. Use “Tomar foto”.');return}
  const v=$('vid');v.srcObject=scanStream;try{await v.play()}catch(e){}
  const tick=async()=>{if(!scanStream)return;try{const c=await det.detect(v);if(c.length)onCode(c[0].rawValue)}catch(e){}if(scanStream)setTimeout(tick,250)};tick();
}
function stopScan(){
  if(zxReader){const r=zxReader;zxReader=null;try{r.reset()}catch(e){}}
  if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}
}
async function scanFoto(inp){
  const f=inp.files[0];inp.value='';if(!f)return;const cb=PHOTO_CB||encontrado;PHOTO_CB=null;
  const noLeido=()=>alert('No se detectó el código. Tome la foto más cerca, enfocada y con buena luz.');
  try{
    if(nativo){const c=await new BarcodeDetector().detect(await createImageBitmap(f));c.length?cb(c[0].rawValue):noLeido();return}
    const url=URL.createObjectURL(f);
    try{const r=await new ZXing.BrowserMultiFormatReader().decodeFromImageUrl(url);cb(r.getText())}catch(e){noLeido()}finally{URL.revokeObjectURL(url)}
  }catch(e){alert('No se pudo leer la imagen: '+e.message)}
}
function encontrado(raw){
  const t=buscarCodigo(raw);if(t){FT='epp';verTrab(t.id);return}
  const v=String(raw).trim().toUpperCase();PEND=/^\d{9,10}$/.test(v)?{cedula:cedNorm(v)}:{codigo:v};
  openModal(`<h2>Carnet no registrado</h2><p>Se leyó: <b>${esc(v)}</b></p><p>¿Registrar un nuevo trabajador con este dato?</p>
  <div class="actions"><button class="btn" onclick="formTrab('',PEND)">Registrar</button><button onclick="closeModal()">Cerrar</button></div>`);
}

function descargar(nombre,contenido,tipo){
  const blob=new Blob([contenido],{type:tipo});
  try{const file=new File([blob],nombre,{type:tipo});if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:nombre}).catch(()=>{});return}}catch(e){}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nombre;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

  if(tipo==='matrizCap'){rows.push(['Código','Cédula','Nombre','Puesto','Supervisor','Capacitación','Fecha','Vence','Estado']);act.forEach(t=>capEstado(t).forEach(c=>rows.push([t.codigo,t.cedula,t.nombre,pn(t),t.supervisor,c.cap.nombre,showD(c.fecha),showD(c.vence),c.est==='ok'?'Recibida':LBL[c.est]])))}
  if(tipo==='entregas'){rows.push(['Fecha','Código','Cédula','Nombre','Puesto','Tipo','Ítem','Talla','Cantidad','Motivo']);[...S.entregas].sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(x=>{const t=T(x.trabId)||{},e=EP(x.eppId)||{};rows.push([showD(x.fecha),t.codigo,t.cedula,t.nombre,t.puestoId?pn(t):'',e.tipo==='dot'?'Dotación':'EPP',e.nombre,x.talla,x.cant,x.motivo])})}
  if(tipo==='fumig'){rows.push(['Código','Cédula','Nombre','Puesto','Módulo','Ingreso empresa','Ingreso al área','Fecha de cambio','Días','Estado','Capacitación fitosanidad']);act.filter(esFumig).forEach(t=>{const r=rotEstado(t),f=capEstado(t).find(c=>c.cap.id==='fito');rows.push([t.codigo,t.cedula,t.nombre,pn(t),t.modulo,showD(t.ingreso),showD(t.inicioPuesto),r?(r.def?'Definitivo':showD(r.fecha)):'',r&&!r.def?r.dias:'',r?(r.def?'Definitivo':r.est==='venc'?'Debe rotar':r.est==='prox'?'Próximo':'Al día'):'',f?(f.tiene?'Sí '+showD(f.fecha):'No'):''])})}
  if(tipo==='inspecciones'){rows.push(['Fecha','Código','Nombre','Puesto','Bloque','Supervisor','Usa EPP','Observación']);[...S.inspecciones].sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(i=>{const t=T(i.trabId)||{};rows.push([showD(i.fecha),t.codigo,t.nombre,t.puestoId?pn(t):'',t.bloque,t.supervisor,{si:'Sí',parcial:'Parcial',no:'No'}[i.usa],i.obs])})}
  if(tipo==='personal'){rows.push(['Código','Cédula','Nombre','Puesto','Actividad','Bloque','Supervisor','Ingreso','Estado','Salida','Días trabajados','Motivo salida']);S.trab.forEach(t=>rows.push([t.codigo,t.cedula,t.nombre,pn(t),t.actividad,t.bloque,t.supervisor,showD(t.ingreso),activo(t)?'Activo':'Retirado',showD(t.salida),t.salida&&t.ingreso?diffDates(t.ingreso,t.salida):'',t.motivoSalida]))}
  if(tipo==='estimacion'){const r=estimar();rows.push([`Pedido próximos ${r.H} días · margen ${S.cfg.margen}% · ingresos esperados/mes ${r.porMes}`]);rows.push(['Tipo','Ítem','Talla','Stock','Cambios programados','Nuevos ingresos','Total con margen','Comprar']);r.filas.forEach(f=>f.det.forEach(x=>rows.push([f.e.tipo==='epp'?'EPP':'Dotación',f.e.nombre,tallaTxt(x.k),x.stock,x.ren,x.nue,x.total,x.comprar])))}
  descargar(`${tipo}_${hoy()}.csv`,csv(rows),'text/csv');
}

function restaurar(inp){const f=inp.files[0];inp.value='';if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.trab||!j.epps)throw 0;if(!confirm(`El respaldo tiene ${j.trab.length} trabajadores y ${(j.entregas||[]).length} entregas. REEMPLAZA los datos actuales. ¿Continuar?`))return;S={...defaults(),...j};save();render();alert('Respaldo restaurado.')}catch(e){alert('El archivo no es un respaldo válido.')}};r.readAsText(f)}
function borrarTodo(){if(confirm('¿Borrar TODOS los datos de este celular? Haga un respaldo antes.')&&confirm('¿Está segura? No se puede deshacer.')){S=defaults();save();render()}}

/* ================= Importar matriz Excel ================= */
function cargarXLSX(){return window.XLSX?Promise.resolve():new Promise((ok,err)=>{const s=document.createElement('script');s.src='xlsx.full.min.js';s.onload=ok;s.onerror=()=>err(new Error('No se pudo cargar el lector de Excel.'));document.head.appendChild(s)})}
function hojaTabla(wb,nombre,claves){
  const n=wb.SheetNames.find(x=>norm(x)===norm(nombre));if(!n)return null;
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''});
  const hi=rows.slice(0,15).findIndex(r=>claves.every(k=>r.some(c=>norm(c).includes(k))));if(hi<0)return null;
  const head=rows[hi].map(norm);
  const col=(...ks)=>{for(const k of ks){const i=head.indexOf(k);if(i>=0)return i}for(const k of ks){const i=head.findIndex(h=>h.startsWith(k));if(i>=0)return i}return -1};
  return{col,data:rows.slice(hi+1).filter(r=>r.some(c=>c!==''&&c!=null))};
}
const txt=v=>v==null?'':String(v).replace(/\s+/g,' ').trim();
function claveNombre(s){return norm(s).replace(/[^a-z ]/g,'').trim()}
async function importarExcel(inp){
  const f=inp.files[0];inp.value='';if(!f)return;
  toast('Leyendo matriz…');
  try{await cargarXLSX()}catch(e){alert(e.message);return}
  let wb;try{wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true})}catch(e){alert('No se pudo leer el archivo: '+e.message);return}
  const R={nuevos:0,act:0,ret:0,adm:0,fito:0,caps:0,eppImp:0,roles:0,hojas:[]};
  const porCed={},porCod={},porNom={};
  const indexar=t=>{if(t.cedula)porCed[t.cedula]=t;if(t.codigo)porCod[t.codigo]=t;porNom[claveNombre(t.nombre)]=t};
  S.trab.forEach(indexar);
  const vistos=new Set();
  const buscar=(ced,cod,nom)=>(ced&&porCed[ced])||(cod&&porCod[cod])||(nom&&porNom[claveNombre(nom)])||null;
  const porNombre=nom=>{const k=claveNombre(nom);if(!k)return null;if(porNom[k])return porNom[k];
    const tk=k.split(' ').filter(x=>x.length>1);if(tk.length<2)return null;
    const c=S.trab.filter(t=>{const tt=claveNombre(t.nombre).split(' ');return tk.every(x=>tt.includes(x))});return c.length===1?c[0]:null};
  function upsert(o,{retirado}={}){
    let t=buscar(o.cedula,o.codigo,o.nombre);
    if(t&&retirado&&vistos.has(t.id))return t;
    if(!t){t={id:uid(),roles:[],tallas:{},estado:'activo',salida:''};S.trab.push(t);R.nuevos++}else R.act++;
    for(const[k,v]of Object.entries(o)){if(k==='tallas'){t.tallas={...(t.tallas||{}),...Object.fromEntries(Object.entries(v).filter(x=>x[1]))}}else if(v!==''&&v!=null)t[k]=v}
    if(!t.puestoManual)t.puestoId=asignarPuesto([t.actividad,t.area,t.bloque]);
    if(!t.inicioPuesto)t.inicioPuesto=t.ingreso||'';
    vistos.add(t.id);indexar(t);return t;
  }
  // ACTIVOS y SALIDAS (misma estructura)
  for(const[hoja,ret]of[['ACTIVOS',false],['SALIDAS',true]]){
    const h=hojaTabla(wb,hoja,['cedula','nombres y apellidos']);if(!h)continue;R.hojas.push(hoja);
    const C={cod:h.col('codigo'),ced:h.col('cedula'),nom:h.col('nombres y apellidos'),ing:h.col('fec.ing','fec. ing'),act:h.col('actividad que realiza','actividad'),area:h.col('area'),blq:h.col('bloque'),ofi:h.col('oficina'),sup:h.col('supervisor a cargo'),tec:h.col('tecnico a cargo'),gen:h.col('genero'),est:h.col('estado'),sal:h.col('fecha de salida'),mot:h.col('motivo'),capsso:h.col('capacitados por sso'),
      tl:Object.fromEntries([['botas','talla botas'],['guantes','talla guantes'],['buso','buso'],['camisa','camisa'],['pantalon','pantalon'],['calentador','calentador'],['mandil','mandil'],['zapatos','zapatos']].map(([k,c])=>[k,h.col(c)]))};
    const g=(r,i)=>i>=0?r[i]:'';
    for(const r of h.data){
      const nombre=txt(g(r,C.nom)).toUpperCase();if(!nombre)continue;
      const estado=up(g(r,C.est)),salida=parseFecha(g(r,C.sal));
      const esRet=ret||estado.startsWith('SALI')||estado.startsWith('INACT')||estado.startsWith('RETIR');
      const o={codigo:txt(g(r,C.cod)).toUpperCase(),cedula:cedNorm(g(r,C.ced)),nombre,ingreso:parseFecha(g(r,C.ing)),actividad:txt(g(r,C.act)),area:txt(g(r,C.area)),bloque:txt(g(r,C.blq))||txt(g(r,C.ofi)),supervisor:txt(g(r,C.sup)),tecnico:txt(g(r,C.tec)),genero:up(g(r,C.gen)).slice(0,1),
        tallas:Object.fromEntries(Object.entries(C.tl).map(([k,i])=>[k,txt(g(r,i)).toUpperCase()])),estado:esRet?'retirado':'activo'};
      if(esRet){o.salida=salida;o.motivoSalida=txt(g(r,C.mot))}else{o.salida='';o.motivoSalida=''}
      const t=upsert(o);if(esRet)R.ret++;
      const cs=txt(g(r,C.capsso));
      if(cs){const fecha=parseFecha(g(r,C.capsso))||parseFecha(cs.replace(/^\D+/,''));const cap=/DRENCH/i.test(cs)?'drench':'fito';
        if(CA(cap)&&!S.capReg.some(x=>x.trabId===t.id&&x.capId===cap&&x.importado)){S.capReg.push({id:uid(),trabId:t.id,capId:cap,fecha,nota:'Matriz: '+cs,importado:true});R.caps++}}
    }
  }
  // PASIVOS (historial de salidas)
  {const h=hojaTabla(wb,'PASIVOS',['cedula','nombres y apellidos']);if(h){R.hojas.push('PASIVOS');
    const C={cod:h.col('codigo'),ced:h.col('cedula'),nom:h.col('nombres y apellidos'),ing:h.col('fec.ing'),area:h.col('area'),blq:h.col('bloque'),ofi:h.col('oficina'),sup:h.col('supervisor a cargo'),sal:h.col('fecha de salida'),mot:h.col('motivo')};
    const g=(r,i)=>i>=0?r[i]:'';
    for(const r of h.data){const nombre=txt(g(r,C.nom)).toUpperCase();if(!nombre)continue;
      const o={codigo:txt(g(r,C.cod)).toUpperCase(),cedula:cedNorm(g(r,C.ced)),nombre,ingreso:parseFecha(g(r,C.ing)),area:txt(g(r,C.area)),bloque:txt(g(r,C.blq)),actividad:txt(g(r,C.blq))||txt(g(r,C.ofi)),supervisor:txt(g(r,C.sup)),estado:'retirado',salida:parseFecha(g(r,C.sal)),motivoSalida:txt(g(r,C.mot))};
      const ya=buscar(o.cedula,o.codigo,o.nombre);if(ya&&vistos.has(ya.id))continue;
      upsert(o,{retirado:true});R.ret++}}}
  // PERSONAL ADMINISTRATIVO
  {const h=hojaTabla(wb,'PERSONAL ADMINISTRATIVO',['cedula','trabajador']);if(h){R.hojas.push('PERSONAL ADMINISTRATIVO');
    const C={cod:h.col('codigo'),ced:h.col('cedula'),nom:h.col('trabajador'),ing:h.col('fecha_ingreso'),car:h.col('cargo'),area:h.col('area_c'),gen:h.col('genero')};const g=(r,i)=>i>=0?r[i]:'';
    for(const r of h.data){const nombre=txt(g(r,C.nom)).toUpperCase();if(!nombre)continue;
      const ya=buscar(cedNorm(g(r,C.ced)),txt(g(r,C.cod)).toUpperCase(),nombre);if(ya&&vistos.has(ya.id))continue;
      const t=upsert({codigo:txt(g(r,C.cod)).toUpperCase(),cedula:cedNorm(g(r,C.ced)),nombre,ingreso:parseFecha(g(r,C.ing)),actividad:txt(g(r,C.car)),area:txt(g(r,C.area)),genero:up(g(r,C.gen)).slice(0,1)==='F'?'M':'H',estado:'activo'});
      if(!t.puestoManual)t.puestoId='admin';R.adm++}}}
  // ROTACION FITO
  {const h=hojaTabla(wb,'ROTACION FITO',['actividad','fecha ingreso al area']);if(h){R.hojas.push('ROTACION FITO');
    const C={cod:h.col('codigo'),ced:h.col('c.i','cedula'),nom:h.col('nombres'),act:h.col('actividad'),ingA:h.col('fecha ingreso al area'),cam:h.col('fecha cambio')};const g=(r,i)=>i>=0?r[i]:'';
    for(const r of h.data){const nombre=txt(g(r,C.nom)).toUpperCase();if(!nombre)continue;
      const t=buscar(cedNorm(g(r,C.ced)),txt(g(r,C.cod)).toUpperCase(),nombre)||porNombre(nombre);if(!t)continue;
      if(!t.actividad||!esFumig(t))t.actividad=txt(g(r,C.act));if(!t.puestoManual)t.puestoId=asignarPuesto([txt(g(r,C.act))]);
      const ia=parseFecha(g(r,C.ingA));if(ia)t.inicioPuesto=ia;
      const cam=g(r,C.cam);if(/definitiv/i.test(String(cam))){t.rotDefinitivo=true;t.fechaCambio=''}else{const fc=parseFecha(cam);if(fc){t.fechaCambio=fc;t.rotDefinitivo=false}}
      R.fito++}}}
  // Capacitación SSO (fitosanidad: módulo, capacitación, EPP inicial)
  {const h=hojaTabla(wb,'Capacitación SSO',['nomina actual','puesto de trabajo']);if(h){R.hojas.push('Capacitación SSO');
    const C={nom:h.col('nomina actual'),mod:h.col('area'),cap:h.col('fecha capacitacion'),ini:h.col('epps inicial'),epp:h.col('fecha de epps'),rot:h.col('fecha de rotacion')};const g=(r,i)=>i>=0?r[i]:'';
    for(const r of h.data){const nombre=txt(g(r,C.nom)).toUpperCase();if(!nombre)continue;const t=porNombre(nombre);if(!t)continue;
      const mod=txt(g(r,C.mod)).toUpperCase();if(mod)t.modulo=mod;
      const fc=parseFecha(g(r,C.cap));if(fc&&!S.capReg.some(x=>x.trabId===t.id&&x.capId==='fito'&&x.fecha===fc)){S.capReg.push({id:uid(),trabId:t.id,capId:'fito',fecha:fc,nota:'Matriz Capacitación SSO',importado:true});R.caps++}
      const fr=parseFecha(g(r,C.rot));if(fr&&!t.fechaCambio&&!t.rotDefinitivo)t.fechaCambio=fr;
      const p=PU(t.puestoId);
      for(const[ci,mot]of[[C.ini,'Kit inicial (matriz)'],[C.epp,'Cambio (matriz)']]){const fe=parseFecha(g(r,ci));if(!fe||!p)continue;
        p.epps.filter(pe=>EP(pe.eppId)?.tipo==='epp').forEach(pe=>{if(S.entregas.some(x=>x.trabId===t.id&&x.eppId===pe.eppId&&x.fecha===fe))return;const e=EP(pe.eppId),tl=e.talla?tallaDe(t,e):'';S.entregas.push({id:uid(),trabId:t.id,eppId:pe.eppId,fecha:fe,cant:pe.cant,talla:tl==='S/T'?'':tl,motivo:mot,importado:true});R.eppImp++})}
    }}}
  // Brigadas, COPASHT y comités
  const ponerRol=(t,rol)=>{if(!t)return;t.roles=t.roles||[];if(!t.roles.includes(rol)){t.roles.push(rol);R.roles++}};
  S.trab.forEach(t=>t.roles=(t.roles||[]).filter(r=>!/^(Brigada|COPASHT|Comité)/.test(r)));
  {const n=wb.SheetNames.find(x=>norm(x)==='brigadas');if(n){R.hojas.push('BRIGADAS');let brig='',ni=-1,ci=-1;
    for(const r of XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''})){
      const b=r.map(txt).find(c=>/^BRIGADA DE/i.test(c));if(b){brig=b.replace(/^BRIGADA DE (MANEJO DE )?/i,'').replace(/\s+/g,' ').trim();ni=ci=-1;continue}
      const h=r.map(norm);if(h.some(c=>c.startsWith('nombre y apellido'))){ni=h.findIndex(c=>c.startsWith('nombre y apellido'));ci=h.indexOf('codigo');continue}
      if(!brig||ni<0)continue;const nm=txt(r[ni]);if(!nm)continue;
      const cod=ci>=0?txt(r[ci]).toUpperCase():'';const t=(cod&&porCod[cod])||porNombre(nm);
      ponerRol(t,`Brigada ${brig.toLowerCase()}${r.some(c=>/Jefe de Brigada/i.test(txt(c)))?' (jefe)':''}`)}}}
  {const h=hojaTabla(wb,'COPASHT',['apellidos y nombres','funcion']);if(h){R.hojas.push('COPASHT');const ni=h.col('apellidos y nombres'),fi=h.col('funcion');
    h.data.forEach(r=>{const nm=txt(r[ni]);if(nm&&!/APELLIDOS/i.test(nm))ponerRol(porNombre(nm),'COPASHT – '+txt(r[fi]).toLowerCase())})}}
  {const h=hojaTabla(wb,'COMITES',['nombre','comite']);if(h){R.hojas.push('COMITES');const ni=h.col('nombre'),ci=h.col('comite');
    h.data.forEach(r=>{const nm=txt(r[ni]);if(nm)ponerRol(porNombre(nm),'Comité '+txt(r[ci]).toLowerCase())})}}
  if(!R.hojas.length){alert('No se encontraron hojas reconocibles (ACTIVOS, PASIVOS…).');return}
  S.cfg.importado=hoy()+' · '+f.name;save();render();
  const act=S.trab.filter(activo).length;
  alert(`Importación lista ✔\n\nHojas leídas: ${R.hojas.join(', ')}\n\n• Activos en la app: ${act}\n• Personas nuevas: ${R.nuevos} · actualizadas: ${R.act}\n• Retirados (historial): ${R.ret}\n• Administrativos: ${R.adm}\n• Fumigación actualizada: ${R.fito}\n• Capacitaciones importadas: ${R.caps}\n• Entregas de EPP importadas: ${R.eppImp}\n• Brigadas/comités: ${R.roles}\n\nNo se importaron sueldos, cuentas, bancos, correos, teléfonos, direcciones, etnia ni datos médicos.`);
}
